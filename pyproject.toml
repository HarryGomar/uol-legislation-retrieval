[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uol"
version = "1.0.0"
description = "Retrieval of Mexican federal legislation from court facts with language models and learning to rank"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# the versions the thesis ran; the trained trees depend on numpy and LightGBM exactly
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.7.2",
    "lightgbm==4.7.0",
    "nltk==3.9.1",
    "pandas==2.2.2",
    "pyarrow>=16",
]

[project.urls]
Repository = "https://github.com/HarryGomar/uol-legislation-retrieval"
Dataset = "https://huggingface.co/datasets/HarryGmr/uol-legislation-retrieval"

[project.optional-dependencies]
encoder = ["torch", "transformers==5.17.0", "sentence-transformers==6.1.0", "bitsandbytes==0.50.2",
           "accelerate==1.15.0", "huggingface_hub==1.32.0"]
model = ["openai"]
experiments = ["matplotlib"]
test = ["pytest"]

[project.scripts]
uol = "uol.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uol = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
